# check.py 가 읽는 문체 규칙. 목록을 고치면 다음 빌드부터 반영된다.
# pattern 은 파이썬 정규식.

# 한 불릿(한 문장 단위)에 쓸 수 있는 기호 개수. 기술 칩·SKILLS 나열은 제외.
symbol_limits:
  "—": 1
  "·": 1
  "→": 1

# 괄호 안의 기술 나열(Redis·Kafka·MySQL …)은 기호 개수에서 뺀다 (2026-09-29)
symbol_ignore_parens: true

# 수치가 아니어도 허용하는 '→': ASCII 이름끼리의 전환(버전·라이브러리 교체). 허용한 '→'는 개수에서도 뺀다 (2026-09-29)
#   예: Java 8 → 17, Spring Boot 2 → 3, javax.persistence → jakarta.persistence
arrow_allow:
  - "[A-Za-z0-9_./-]+(?: [vV]?[0-9][\\w.]*)? → [A-Za-z0-9_./-]+(?: [vV]?[0-9][\\w.]*)?"

# 상투어: 걸리면 오류(error). 본인이 면접에서 말로 쓰지 않는 단어.
banned:
  - { pattern: "고도화", hint: "무엇을 어떻게 바꿨는지로" }
  - { pattern: "극대화", hint: "수치로" }
  - { pattern: "체계적", hint: "빼거나 구체 절차로" }
  - { pattern: "효율적", hint: "무엇이 얼마나 줄었는지로" }
  - { pattern: "원활한", hint: "빼기" }
  - { pattern: "다양한", hint: "개수나 목록으로" }
  - { pattern: "핵심", hint: "빼거나 구체 명사로" }
  - { pattern: "혁신", hint: "빼기" }
  - { pattern: "견고한", hint: "빼기" }
  - { pattern: "선제적", hint: "'미리'" }
  - { pattern: "확보", hint: "'만듦', '지킴' 등 실제 행동으로" }
  - { pattern: "[을를]\\s?통해", hint: "'~로', '~해서'" }
  - { pattern: "기반으로", hint: "'~로', '~를 써서'" }
  - { pattern: "단순히[^.]*아니라", hint: "대비 구문 빼기" }

# 번역투·영어 개념어: 경고(warn). 쉬운 우리말이 있으면 바꾸고, 정확한 기술 용어면 둔다.
# (CAS, gRPC, context 같은 용어는 여기 넣지 않는다)
translationese:
  - { pattern: "(?i)\\bfence\\b", hint: "'소유권 검사', '세대 번호 검사'" }
  - { pattern: "(?i)durable\\s*claim", hint: "'DB에 남는 작업 점유'" }
  - { pattern: "성립", hint: "'된다', '맞다'" }
  - { pattern: "봉인", hint: "'막음'" }
  - { pattern: "격리", hint: "'나눔', '막음'" }
  - { pattern: "일원\\s?관리", hint: "'한 곳에서 관리'" }

# 사내 고유 이름(함수·타입·필드·서비스 이름): 경고. 회사 밖 사람은 뜻을 모른다. 하는 일로 풀어 쓴다 (2026-09-30)
#   전: gRPC 서버 스트림 `WatchOrderProgress` 하나로 통합  후: gRPC 서버 스트림 함수 하나로 통합
#   CamelCase 이름과 백틱 안 단어 하나짜리 이름을 잡는다. 널리 아는 공개 이름은 allow 에 둔다.
internal_names:
  patterns:
    - "(?<![A-Za-z0-9_])[A-Z][a-z0-9]+(?:[A-Z][a-z0-9]+)+(?![A-Za-z0-9_])"   # \\b 는 한글 조사 앞에서 경계로 안 잡힌다
    - "`[A-Za-z_]\\w*`"
  allow: [GitLab, GitHub, OpenStack, WebSocket, WaitGroup, ConfigMap, OpenShift, JavaScript, TypeScript, PowerShell]
  hint: "하는 일로 풀어 쓰기 (예: '발행 함수', '토큰 관리자', '주문 서비스')"

# 쓸데없는 괄호 풀이: 경고. 한국어 뒤에 같은 뜻 영어를 괄호로 붙이지 않는다 (2026-09-30)
#   전: 점검 시간(maintenance window)  후: 점검 시간  (영어 용어 하나로 통하면 영어만 써도 된다)
#   뜻을 더해 주는 괄호는 둔다: 결제 모듈(PG사 SDK)과 호출부(주문 서비스)를 분리
gloss_parens: "[가-힣]+\\((?:[a-z][a-z-]*)(?: [a-z][a-z-]*)*\\)"

# 남아 있으면 제출 불가 (error)
placeholders:
  - "【"
  - "】"
  - "\\[확인 필요\\]"
  - "(?i)\\bTODO\\b"
  - "(?i)\\bTBD\\b"
  - "\\bXXX\\b"
  - "\\{\\{"
  - "○○"
  - "\\bN\\s?(건|개|명|%|회|배)"
