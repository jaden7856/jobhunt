# 공고 수집 설정 (예시). 복사해서 sources.yaml 로 쓴다. 사이트별 방법은 references/sources.md.

# 제목 필터: positive 중 하나가 들어가야 통과, negative 가 들어가면 제외.
# 언어(Go, Kotlin 등)로 좁히지 않는다. 언어 조건은 평가 단계에서 자격요건 본문으로 판정.
title_filter:
  # 영어·한글 표기를 둘 다 넣는다 (Cloud Engineer / 클라우드 엔지니어). 게임 서버처럼 언어가 갈리는 직군은 직무명으로 빼지 말고
  # 통과시킨 뒤 자격요건의 언어·엔진으로 거른다 (score.py stack 게이트).
  positive: [백엔드, Backend, 서버 개발, Server Engineer, Software Engineer, Platform Engineer, 플랫폼 엔지니어, Cloud Engineer, 클라우드 엔지니어, 서버 프로그래머, DevOps]
  negative: [프론트엔드, Frontend, iOS, Android, 인턴, 신입, Junior, QA]

# 연차: 공고에 연차 숫자가 있을 때만 적용(원티드·점핏).
career_filter:
  exclude_if_max_below: 2
  exclude_if_min_at_least: 10

# 근무지: always_allow 는 항상 통과, block 은 제외, 나머지는 통과시키고 [근무지 확인 필요] 표시.
location_filter:
  always_allow: [서울, Seoul, 판교, 성남, 분당, 재택]
  allow: [경기, Gyeonggi, 대한민국, Korea]
  block: [부산, 대구, 대전, 광주, 울산, 세종, 제주, United States, Japan]

# 회사 별칭: 사이트마다 다른 표기를 하나로 (중복·쿨다운·제외 회사 판정)
company_aliases:
  가나다커머스: [Ganada Commerce, 가나다]

# 채용 플랫폼
boards:
  wanted:   { enabled: true, job_group_id: 518, job_ids: [872, 674, 10110], years: 4 }   # 서버 · DevOps · 소프트웨어 엔지니어
  jumpit:   { enabled: true, keywords: [백엔드, 서버, 플랫폼] }
  saramin:  { enabled: true, keywords: [백엔드 개발자, 서버 개발자] }
  jobkorea: { enabled: true, keywords: [백엔드 개발자, 서버 개발자] }
  linkedin: { enabled: true, keywords: [백엔드 개발자, backend engineer], location: "Seoul, South Korea", korean_only: true, period_days: 30 }
  remember: { enabled: false, keywords: [백엔드] }

# 자체 채용 사이트로 뽑는 기업. priority: true 는 매 스캔마다 전부 돈다.
# api 는 references/sources.md 에 방법이 있는 것만 적는다. 확인 안 한 URL은 넣지 않는다.
companies:
  - { name: 가나다커머스, careers_url: "https://careers.example.com", priority: true }
  - { name: 라마바페이, careers_url: "https://boards.greenhouse.io/example", api: "https://boards-api.greenhouse.io/v1/boards/example/jobs", priority: false }
  - { name: 사아자, careers_url: "https://example.career.greetinghr.com/", priority: true, method: browser }   # 스크립트가 못 읽는 곳은 method: browser
