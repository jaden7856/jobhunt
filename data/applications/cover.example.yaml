# 자기소개서·지원서 문항 예시 (가상 인물). 실제 파일은 data/applications/covers/<회사>_<포지션>.yaml
# 검사: python3 scripts/cover_check.py <파일>   지침: references/cover_letter.md
# 문항 2는 검사에 걸리는 예 (너무 짧고 금지어 '다양한'·'~을 통해')
company: 가나다커머스
role: 백엔드 개발자
questions:
  - q: "지원 동기와 입사 후 하고 싶은 일을 적어 주세요"
    limit: 500
    count: spaces
    answer: |
      주문 API 응답 시간을 820ms에서 240ms로 줄이면서, 사용자가 체감하는 속도가 매출로 이어지는 것을 숫자로 확인했습니다. 가나다커머스는 하루 주문 수십만 건을 처리하면서도 결제 오류율을 공개 지표로 관리하는 팀이라, 같은 문제를 더 큰 규모에서 다루고 싶어 지원했습니다.
      입사 후에는 정산 배치의 재시작 구조를 먼저 살펴보고 싶습니다. 이전 회사에서 청크 단위 재시작으로 월 6회이던 정산 실패를 0회로 만든 경험이 있어, 실패 원인을 기록으로 좁히는 일부터 시작하겠습니다.
  - q: "가장 어려웠던 기술 문제와 해결 과정을 적어 주세요"
    limit: 800
    count: nospaces
    answer: |
      다양한 방법을 통해 문제를 해결했습니다.
