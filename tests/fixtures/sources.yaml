    careers_url: https://careers.ganadalab.com/
    api: https://boards-api.greenhouse.io/v1/boards/ganadalab/jobs
  - name: 라바소
    careers_url: https://careers.rabaso.co.kr
    ats: ninehire
    company_id: cmp-222
  - name: 가나다랩 채용
    careers_url: https://careers.ganadalab.com/jobs
    links: /jobs/detail/\d+
  - name: 가나다랩
    careers_url: https://careers.ganadalab.io
